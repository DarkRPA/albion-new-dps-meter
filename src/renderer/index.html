<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; connect-src 'none'; object-src 'none'; base-uri 'self'"
    />
    <title>Albion DPS Meter</title>
    <link rel="stylesheet" href="./assets/nexus.css" />
  </head>
  <body>
    <div id="albion-nexus">
      <section id="no-map-screen" role="status" aria-live="polite">
        <span class="waiting-symbol" aria-hidden="true">◇</span>
        <h1>El mapa no ha sido cargado aún,<br />cambia de mapa para comenzar</h1>
        <p>La sesión arrancará automáticamente<br />en cuanto entres a una zona</p>
        <span class="pill">Esperando zona…</span>
        <p id="connection-error" hidden></p>
      </section>
      <div id="meter-app" class="app-window" hidden>
        <div class="workspace">
          <div class="utility-layout">
            <nav class="rail" aria-label="Módulos">
              <button
                data-section="Combate"
                class="active"
                aria-label="Combate"
                aria-pressed="true"
              >
                <span data-icon="swords"></span><span class="rail-label">Combate</span>
              </button>
              <button data-section="Ajustes" aria-label="Ajustes" aria-pressed="false">
                <span data-icon="settings"></span><span class="rail-label">Ajustes</span>
              </button>
            </nav>
            <main class="utility-main">
              <section id="combat-view">
                <div class="heading">
                  <div>
                    <span class="eyebrow">Sesión actual</span>
                    <h2>Medidor de combate</h2>
                  </div>
                  <button class="tool advanced-toggle" data-action="advanced" aria-pressed="false">
                    <span data-icon="chart"></span>Vista avanzada<span
                      class="toggle-track"
                      aria-hidden="true"
                      ><span></span
                    ></span>
                  </button>
                </div>
                <div class="stats">
                  <div class="stat"><label>TIEMPO DE SESIÓN</label><b id="el-timer">—</b></div>
                  <div class="stat"><label>FAMA TOTAL</label><b id="el-fame" class="red">—</b></div>
                  <div class="stat">
                    <label>FAMA / HORA</label
                    ><b class="red" aria-label="Fama por hora no disponible">—</b>
                  </div>
                  <div class="stat">
                    <label>CREDIFAMA</label><b id="el-credit" class="gold">—</b>
                  </div>
                </div>
                <div id="players-layout" class="analysis-grid basic-grid">
                  <section>
                    <div class="heading">
                      <h3>Jugadores <span id="el-count" class="muted small"></span></h3>
                      <div class="switches" aria-label="Métrica">
                        <button data-metric="damage" class="active" aria-pressed="true">Daño</button
                        ><button data-metric="healing" aria-pressed="false">Curación</button>
                      </div>
                    </div>
                    <div id="players-table"></div>
                    <div class="session-strip">
                      <span>Curación del grupo <span id="total-healing" class="green">—</span></span
                      ><span>Daño del grupo <span id="total-damage" class="gold">—</span></span>
                    </div>
                  </section>
                  <aside id="player-inspector" class="inspector" hidden></aside>
                </div>
                <section id="player-breakdown" class="player-breakdown" hidden></section>
              </section>
              <section id="settings-view" hidden>
                <div class="heading">
                  <div>
                    <span class="eyebrow">Ajustes</span>
                    <h2>Tu espacio</h2>
                  </div>
                </div>
                <label class="setting"
                  ><span
                    >Filas compactas<small class="muted" style="display: block"
                      >Más jugadores en el mismo espacio</small
                    ></span
                  ><input type="checkbox" id="compact-rows"
                /></label>
              </section>
            </main>
          </div>
        </div>
        <div class="boss-notice" id="boss-banner" hidden>Modo Boss activo</div>
        <footer class="commands">
          <button data-action="reset"><span data-icon="reset"></span>Reiniciar</button>
          <button data-action="boss" aria-pressed="false">
            <span data-icon="skull"></span>Modo Boss
          </button>
          <button data-action="pause">
            <span data-icon="pause"></span><span id="pause-label">Pausar</span>
          </button>
          <button data-action="copy"><span data-icon="copy"></span>Copiar</button>
          <span class="capture-status" id="el-status" role="status"></span>
        </footer>
        <p id="feedback" role="status" aria-live="polite" hidden></p>
        <div class="copy-fallback" id="copy-fallback" hidden>
          <label
            >Selecciona y copia el resumen<textarea
              id="copy-text"
              readonly
              rows="5"
            ></textarea></label
          ><button class="tool" data-action="close-copy">Cerrar</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/renderer.js"></script>
    <script type="module" src="./src/data-controller.mjs"></script>
  </body>
</html>
